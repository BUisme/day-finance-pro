<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="DAY Finance Pro — ต้นแบบจัดการแผนการเงินและรายการจริงในอุปกรณ์"
    />
    <title>DAY Finance Pro</title>
  </head>
  <body>
    <div id="root">
      <main
        data-boot-screen
        style="
          background: #000;
          color: #fff;
          min-height: 100vh;
          padding: 48px 24px;
          font-family: Tahoma, system-ui, sans-serif;
        "
      >
        <h1>DAY Finance Pro</h1>
        <p id="boot-message" role="status">กำลังเปิดแอป…</p>
        <noscript>กรุณาเปิด JavaScript เพื่อใช้งานแอป</noscript
        ><a style="color: #b8f36b" href="./">โหลดหน้าใหม่</a>
      </main>
    </div>
    <script>
      (() => {
        const fail = () => {
          if (!document.querySelector("[data-boot-screen]")) return;
          const message = document.getElementById("boot-message");
          if (message) {
            message.textContent =
              "โหลดแอปไม่สำเร็จ กรุณาลองโหลดหน้าใหม่ หากยังพบปัญหาให้ติดต่อผู้ดูแล ข้อมูลในอุปกรณ์ยังไม่ถูกลบ";
            message.setAttribute("role", "alert");
          }
        };
        window.addEventListener(
          "error",
          (event) => {
            if (
              event.target instanceof HTMLScriptElement &&
              event.target.type === "module"
            )
              fail();
          },
          true,
        );
        window.addEventListener("unhandledrejection", fail);
        window.setTimeout(fail, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
